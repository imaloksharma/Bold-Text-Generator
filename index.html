<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bold Text Generator</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Bold Text Generator </h1>
        <p>Create cool, styled text with ease</p>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container">
        <textarea id="inputText" placeholder="Type your text here..."></textarea>

        <label for="styleSelect">Choose Style:</label>
        <select id="styleSelect">
            <option value="bold">𝗕𝗼𝗹𝗱</option>
            <option value="italic">𝘪𝘵𝘢𝘭𝘪𝘤</option>
            <option value="boldItalic">𝘣𝗼𝗹𝗱 𝗶𝘁𝗮𝗹𝗶𝗰</option>
            <option value="script">𝓢𝓬𝓻𝓲𝓹𝓽</option>
            <option value="fraktur">𝔉𝔯𝔞𝔨𝔱𝔲𝔯</option>

            <option value="sans">𝖲𝖺𝖭𝖲</option>
            <option value="sansBold">𝖡𝖔𝖑𝖽 𝖲𝖺𝖭𝖲</option ption>


            <option value="boxed">🄱🄾🅇🄴🄳</option>
        </select>

        <h3>Converted Output</h3>
        <div id="outputText"></div>
        <button onclick="copyBoldText()">📋 Copy to Clipboard</button>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>Made with ❤️ by Alok Kumar | <a href="https://msnext.in" target="_blank" rel="noopener">MsNext.in</a></p>


    </footer>

    <script src="script.js"></script>
</body>

</html>
